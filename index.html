<script>
const ytPlayers={};
function nextEmbedded(currentId){
  const i=EMBED_ORDER.indexOf(currentId);
  if(i<0||i>=EMBED_ORDER.length-1)return;
  const nextId=EMBED_ORDER[i+1];
  const nextFrame=document.getElementById('yt-'+nextId);
  if(nextFrame) nextFrame.closest('.card')?.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>{try{ytPlayers[nextId]?.playVideo()}catch(e){}},550);
}
function showAutoplayFallback(currentId){
  const i=EMBED_ORDER.indexOf(currentId);
  if(i<0||i>=EMBED_ORDER.length-1)return;
  const b=document.getElementById('continue-'+currentId);
  if(!b)return;
  b.style.display='inline-block';
  b.onclick=()=>{
    b.style.display='none';
    nextEmbedded(currentId);
  };
}
window.onYouTubeIframeAPIReady=function(){
  EMBED_ORDER.forEach(id=>{
    const frame=document.getElementById('yt-'+id);
    if(!frame)return;
    ytPlayers[id]=new YT.Player(frame,{
      events:{
        onStateChange:(e)=>{
          if(e.data===YT.PlayerState.ENDED) nextEmbedded(id);
        },
        onAutoplayBlocked:()=>showAutoplayFallback(id)
      }
    });
  });
};
(function(){
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
