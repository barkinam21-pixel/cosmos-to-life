<script>
const ytPlayers={};
function nextEmbedded(currentId){
  const i=EMBED_ORDER.indexOf(currentId);
  if(i<0||i>=EMBED_ORDER.length-1)return;
  const nextId=EMBED_ORDER[i+1];
  const nextFrame=document.getElementById('yt-'+nextId);
  if(nextFrame) nextFrame.closest('.card')?.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>{try{ytPlayers[nextId]?.playVideo()}catch(e){}},550);
}
function showAutoplayFallback(currentId){
  const i=EMBED_ORDER.indexOf(currentId);
  if(i<0||i>=EMBED_ORDER.length-1)return;
  const b=document.getElementById('continue-'+currentId);
  if(!b)return;
  b.style.display='inline-block';
  b.onclick=()=>{
    b.style.display='none';
    nextEmbedded(currentId);
  };
}
function showEmbedFallback(id){
  const frame=document.getElementById('yt-'+id);
  if(!frame)return;
  const wrap=frame.closest('.video-wrap');
  if(!wrap)return;
  const url='https://www.youtube.com/watch?v='+id;
  wrap.innerHTML='<div class="embed-fallback"><div>הנגן הפנימי לא זמין לסרטון הזה.</div><a target="_blank" rel="noopener" href="'+url+'">פתח את הסרטון ▶</a></div>';
  const note=wrap.nextElementSibling;
  if(note&&note.classList.contains('auto-next-note')) note.textContent='ההטמעה לא זמינה — הסרטון עצמו עדיין נגיש בלחיצה אחת.';
}
window.onYouTubeIframeAPIReady=function(){
  EMBED_ORDER.forEach(id=>{
    const frame=document.getElementById('yt-'+id);
    if(!frame)return;
    ytPlayers[id]=new YT.Player(frame,{
      events:{
        onStateChange:(e)=>{
          if(e.data===YT.PlayerState.ENDED) nextEmbedded(id);
        },
        onError:(e)=>{
          if([2,5,100,101,150,153].includes(e.data)) showEmbedFallback(id);
        },
        onAutoplayBlocked:()=>showAutoplayFallback(id)
      }
    });
  });
};
(function(){
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
